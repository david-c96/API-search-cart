<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="sign.css">
    <script src="script.js"></script>

    <script>
        function showForm(form) {
            document.getElementById("login-form").style.display = form === "login" ? "block" : "none";
            document.getElementById("register-form").style.display = form === "register" ? "block" : "none";

            document.getElementById("btn-login").classList.toggle("active", form === "login");
            document.getElementById("btn-register").classList.toggle("active", form === "register");
        }
    </script>
</head>

<body>
    <div class="container">

        <!-- Pestañas -->
        <div class="tabs">
            <button id="btn-login" type="button" class="tab" onclick="showForm('login')">Iniciar Sesión</button>
            <button id="btn-register" type="button" class="tab" onclick="showForm('register')">Crear Usuario</button>
        </div>

        <!-- FORMULARIO LOGIN -->
        <form id="login-form" style="display: block;">
            <h2>Iniciar Sesión</h2>

            <label for="user">Nombre de Usuario</label>
            <input type="text" id="user" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" required>

            <button type="submit">Iniciar Sesión</button>

            <div id="login-error" class="error"></div>
        </form>

        <!-- FORMULARIO REGISTRO -->
        <form id="register-form" style="display: none;">
            <h2>Crear Usuario</h2>

            <label for="Newuser">Usuario</label>
            <input type="text" id="Newuser" required>

            <label for="Newpassword">Contraseña</label>
            <input type="password" id="Newpassword" required>

            <button type="submit" class="btn">Crear Usuario</button>

            <div id="register-error" class="error"></div>
        </form>

    </div>
</body>
</html>
